<!DOCTYPE html>
<html dir="ltr" lang="en-US">
  <head>
    <!-- Required Meta Tags -->
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <!-- Mobile Specific Meta Tags -->
    <meta name="viewport" content="initial-scale=1, viewport-fit=cover, width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Schmalfeldt">
    <meta name="application-name" content="Schmalfeldt">
    <meta name="theme-color" content="#0c1832">

    <title>{{ title }}</title>

    <meta name="description" content="{{ description }}">
    <meta name="cache-control" content="public">
    <meta name="author" content="Peter Schmalfeldt">
    <meta name="googlebot" content="{{ package.robots }}">
    <meta name="bingbot" content="{{ package.robots }}">
    <meta name="robots" content="{{ package.robots }}">

    <!-- Twitter META Info -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@mrmidi">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:creator" content="@mrmidi">
    <meta name="twitter:image" content="{{ package.base }}{{ card_image }}">
    <meta name="twitter:image:alt" content="{{ title }}">
    <meta name="twitter:domain" content="peterschmalfeldt.com">

    <!-- Open Graph protocol -->
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:url" content="{{ package.base }}{{ canonical }}">
    <meta property="og:image" content="{{ package.base }}{{ card_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ title }}">
    <meta property="og:site_name" content="Peter Schmalfeldt">
    <meta property="og:description" content="{{ description }}">

    <!-- Dublin Core Metadata -->
    <meta name="dc:language" content="en_US">
    <meta name="dc:title" content="{{ title }}">
    <meta name="dc:source" content="{{ package.base }}/">

    <!-- Profile Schema -->
    <link rel="profile" href="https://gmpg.org/xfn/11">

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="{{ package.assetPath }}images/favicon.ico">
    <link rel="apple-touch-icon" href="{{ package.assetPath }}images/apple/icon-57x57.jpg">
    <link rel="apple-touch-icon" sizes="72x72" href="{{ package.assetPath }}images/apple/icon-72x72.jpg">
    <link rel="apple-touch-icon" sizes="114x114" href="{{ package.assetPath }}images/apple/icon-114x114.jpg">
    <link rel="apple-touch-icon" sizes="144x144" href="{{ package.assetPath }}images/apple/icon-144x144.jpg">

    <!-- Canonical -->
    <link rel="canonical" href="{{ package.base }}{{ canonical }}">

    <!-- Short Link -->
    <link rel="shortlink" href="{{ package.base }}/" />

    <!-- OEmbed Support -->
    <link rel="alternate" type="application/json+oembed" href="{{ package.base }}/oembed.json" />
    <link rel="alternate" type="text/xml+oembed" href="{{ package.base }}/oembed.xml" />

    <!-- CSS -->
    <link rel="stylesheet" href="{{ package.assetPath }}css/style{{ package.buildVersion }}.min.css{{ package.cacheBreak }}">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ package.analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ package.analytics }}');
    </script>

    <!-- JSON+LD Person -->
    {{> jsonld}}

  </head>
  <body>
    <a class="skip-to-content-link" href="#main-wrapper" data-track data-category="Nav" data-action="Header" data-label="Skip to Main Content">
      Skip to Main Content
    </a>

    <!-- Page Wrapper -->
    <div id="page-wrapper">
      {{> header}}

      <main id="main-wrapper" tabindex="-1">
        <!-- Content Wrapper -->
        <div id="content-wrapper">
          {{> body}}
        </div>
        <!-- Content Wrapper Ends -->
      </main>

      {{> footer}}
    </div>
    <!-- Page Wrapper Ends -->

    <button id="calendly-trigger" class="calendly-trigger js-calendly-open no-print" type="button" aria-haspopup="dialog" aria-controls="calendly-modal" data-track data-category="Scheduling" data-action="Open" data-label="Floating Book Time">
      <i class="ion-calendar" aria-hidden="true"></i>
      <span>Book Time</span>
    </button>

    <div id="calendly-modal" class="calendly-modal" hidden>
      <div class="calendly-modal-backdrop" data-calendly-close></div>
      <div class="calendly-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="calendly-modal-title" tabindex="-1">
        <div class="calendly-modal-header">
          <h2 id="calendly-modal-title">Book time with me</h2>
          <button class="calendly-modal-close" type="button" data-calendly-close aria-label="Close scheduling window">
            <i class="ion-close-round" aria-hidden="true"></i>
          </button>
        </div>
        <div class="calendly-modal-frame">
          <iframe id="calendly-frame" src="about:blank" data-src="https://calendly.com/peterschmalfeldt?embed_type=Inline" title="Schedule time with Peter Schmalfeldt"></iframe>
        </div>
        <div class="calendly-modal-footer">
          <a href="https://calendly.com/peterschmalfeldt" target="_blank" rel="noopener" data-track data-category="Scheduling" data-action="Open" data-label="Open Calendly in New Tab">Open Calendly in a new tab</a>
        </div>
      </div>
    </div>

    <button id="back-to-top" class="hidden" aria-label="Back to Top" data-track data-category="Nav" data-action="Footer" data-label="Back to Top"></button>

    <!-- Scripts -->
    <script>var PS_ENV = '{{ package.env }}';</script>
    <script defer src="{{ package.assetPath }}js/plugins{{ package.buildVersion }}.min.js{{ package.cacheBreak }}"></script>
    <script defer src="{{ package.assetPath }}js/app{{ package.buildVersion }}.min.js{{ package.cacheBreak }}"></script>
  </body>
</html>
