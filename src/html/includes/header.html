<!-- Header -->
<header id="header" class="standard">
  <div class="header-wrapper">
    <div class="container">
      <div id="logo">
        <a href="/" data-track data-category="Nav" data-action="Header" data-label="Home Page">
          {{> header-logo}}
        </a>
      </div>

      <nav id="main-menu" class="hide-menu" aria-label="Main Menu">
        <button id="menu-trigger" class="closed" aria-expanded="false" aria-controls="menu" data-track data-category="Nav" data-action="Header" data-label="Mobile Menu Toggle" aria-label="Toggle Menu"><span></span></button>

        <ul id="menu">
          <li>
            <a href="{{ homePrefix }}#consulting" data-track data-category="Nav" data-action="Header" data-label="Consulting">
              Consulting
            </a>
          </li>
          <li>
            <a href="{{ homePrefix }}#services" data-track data-category="Nav" data-action="Header" data-label="Services">
              Services
            </a>
          </li>
          <li>
            <a href="{{ homePrefix }}#process" data-track data-category="Nav" data-action="Header" data-label="Process">
              Process
            </a>
          </li>
          <li>
            <a href="{{ homePrefix }}#contact" data-track data-category="Nav" data-action="Header" data-label="Contact">
              Contact
            </a>
          </li>
          <li>
            <a href="/resume.html" class="resume"{{#if isResume}} aria-current="page"{{/if}} data-track data-category="Nav" data-action="Header" data-label="Resume" title="Visit My Resume">
              Resume
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>
